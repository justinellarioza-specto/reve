<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Offline · Reve</title>
<style>
  :root{--paper:#f7f6f2;--ink:#13233f;--ink2:#4d5b76;--accent:#ee6c1f}
  @media (prefers-color-scheme:dark){:root{--paper:#0e1628;--ink:#eceff5;--ink2:#a3aec4;--accent:#ff8a3d}}
  body{margin:0;min-height:100dvh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font:17px/1.55 system-ui,sans-serif;padding:24px}
  main{max-width:28rem} h1{font-size:1.8rem;line-height:1.15;margin:.5rem 0} p{color:var(--ink2)}
  button{margin-top:1rem;border:0;border-radius:999px;background:var(--accent);color:#13233f;font:inherit;font-weight:700;padding:.8rem 1.6rem;cursor:pointer}
</style>
</head>
<body><main>
  <svg width="40" height="40" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="12" fill="none" stroke="currentColor" stroke-width="4"/><path d="M16 4a12 12 0 0 1 12 12" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round"/></svg>
  <h1>You're offline</h1>
  <p>Reve needs a connection to save your answers and talk with you. While you wait: close your notes and try to recall the last topic you studied, out loud.</p>
  <button onclick="location.reload()">Try again</button>
</main></body>
</html>
